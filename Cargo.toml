[workspace]
resolver = "3"
# The library is crates/slint-themekit. The gallery is a separate crate so
# that it can consume the library exactly like an app does: from its own
# build script.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-2.0"
repository = "https://github.com/ufoscout/slint-themekit"
homepage = "https://github.com/ufoscout/slint-themekit"

[workspace.dependencies]
slint-themekit = { path = "crates/slint-themekit" }
slint = "1.18.1"
slint-build = "1.18.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
